name: collect
# Download the artifacts of one `run` workflow run, re-gate every run against
# the baseline, and commit runs and ground truth to the `data` branch.
#   pipeline_fault: duplicate_merge (one run's items appended twice) or
#                   mixed_runs (two runs' items merged into one folder)
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Actions run ID of the `run` workflow"
        required: true
      pipeline_fault:
        type: choice
        default: none
        options: [none, duplicate_merge, mixed_runs]

permissions:
  contents: write
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.lock
      - name: Download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ inputs.source_run_id }} -D downloaded
      - name: Arrange
        run: |
          mkdir -p runs ground_truth
          for d in downloaded/run-*; do id=${d#downloaded/run-}; mkdir -p runs/$id; cp -r $d/. runs/$id/; done
          for d in downloaded/truth-*; do id=${d#downloaded/truth-}; mkdir -p ground_truth/$id; cp -r $d/. ground_truth/$id/; done
      - name: "pipeline fault: collect merges wrongly"
        if: inputs.pipeline_fault != 'none'
        run: |
          first=$(ls runs | head -1); second=$(ls runs | sed -n 2p)
          if [ "${{ inputs.pipeline_fault }}" = "duplicate_merge" ]; then
            cp runs/$first/items.jsonl /tmp/items.jsonl; cat /tmp/items.jsonl >> runs/$first/items.jsonl
          elif [ -n "$second" ]; then
            cat runs/$second/items.jsonl >> runs/$first/items.jsonl
          fi
          echo "{\"collect_fault\": \"${{ inputs.pipeline_fault }}\", \"run\": \"$first\"}" > ground_truth/$first/collect.json
      - name: Re-gate
        run: for d in runs/*/; do python -m validity.gate "$d" --baseline auto; done
      - name: Commit to data branch
        run: |
          mv runs /tmp/runs; mv ground_truth /tmp/ground_truth
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git fetch origin data || true
          if git rev-parse --verify origin/data >/dev/null 2>&1; then git checkout -B data origin/data; else git checkout --orphan data; git rm -rf . >/dev/null; fi
          mkdir -p runs ground_truth
          cp -r /tmp/runs/. runs/; cp -r /tmp/ground_truth/. ground_truth/
          git add runs ground_truth
          git commit -m "collect ${{ inputs.source_run_id }} (${{ inputs.pipeline_fault }})" || echo "nothing new"
          git push origin data
