name: collect
# Download the artifacts of one `run` workflow run, re-gate every run against
# the baseline, and commit runs and ground truth to the `data` branch.
#   pipeline_fault: duplicate_merge (a run's items appended twice) or
#                   mixed_runs (another run's items merged in); written as
#                   faulted copies, the originals are kept
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Actions run ID of the `run` workflow"
        required: true
      pipeline_fault:
        type: choice
        default: none
        options: [none, duplicate_merge, mixed_runs]

permissions:
  contents: write
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.lock
      - name: Download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ inputs.source_run_id }} -D downloaded
      - name: Arrange
        run: |
          mkdir -p runs ground_truth
          for d in downloaded/run-*; do id=${d#downloaded/run-}; mkdir -p runs/$id; cp -r $d/. runs/$id/; done
          for d in downloaded/truth-*; do id=${d#downloaded/truth-}; mkdir -p ground_truth/$id; cp -r $d/. ground_truth/$id/; done
      - name: "pipeline fault: collect merges wrongly"
        # Faulted copies are written next to the originals as <run>-cf-<fault>,
        # so the real runs on the data branch are never changed.
        if: inputs.pipeline_fault != 'none'
        run: |
          python - <<'PY'
          import json, os, shutil
          fault = "${{ inputs.pipeline_fault }}"
          runs = sorted(d for d in os.listdir("runs") if "-cf-" not in d)
          for i, rid in enumerate(runs):
              src = f"runs/{rid}"
              if not os.path.exists(f"{src}/items.jsonl"):
                  continue
              dst = f"runs/{rid}-cf-{fault}"
              shutil.copytree(src, dst, dirs_exist_ok=True)
              items = open(f"{src}/items.jsonl").read()
              if fault == "duplicate_merge":
                  extra = items
              else:  # mixed_runs: append the next run's items
                  other = runs[(i + 1) % len(runs)]
                  extra = open(f"runs/{other}/items.jsonl").read() if other != rid else ""
              with open(f"{dst}/items.jsonl", "a") as f:
                  f.write(extra)
              os.makedirs(f"ground_truth/{rid}-cf-{fault}", exist_ok=True)
              if os.path.isdir(f"ground_truth/{rid}"):
                  shutil.copytree(f"ground_truth/{rid}", f"ground_truth/{rid}-cf-{fault}", dirs_exist_ok=True)
              json.dump({"collect_fault": fault, "source_run": rid},
                        open(f"ground_truth/{rid}-cf-{fault}/collect.json", "w"))
          PY
      - name: Re-gate
        run: for d in runs/*/; do python -m validity.gate "$d" --baseline auto; done
      - name: Commit to data branch
        run: |
          mv runs /tmp/runs; mv ground_truth /tmp/ground_truth
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git fetch origin data || true
          if git rev-parse --verify origin/data >/dev/null 2>&1; then git checkout -B data origin/data; else git checkout --orphan data; git rm -rf . >/dev/null; fi
          mkdir -p runs ground_truth
          cp -r /tmp/runs/. runs/; cp -r /tmp/ground_truth/. ground_truth/
          git add runs ground_truth
          git commit -m "collect ${{ inputs.source_run_id }} (${{ inputs.pipeline_fault }})" || echo "nothing new"
          git push origin data
