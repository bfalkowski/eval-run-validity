name: secrets
# Fails if a secret (API key, token, private key) is in the code or anywhere in
# the git history. Runs on every push and pull request.
on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan the whole history, not just the last commit
      - name: No .env or key files tracked
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$|id_rsa' || true)
          if [ -n "$bad" ]; then echo "tracked secret-like files: $bad"; exit 1; fi
      - name: Scan history with gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --redact -v --exit-code 1
